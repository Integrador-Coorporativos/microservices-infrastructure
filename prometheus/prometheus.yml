---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "academic-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "if-performance_academic-service:8085"

  - job_name: "import-and-report-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "if-performance_import-and-report-service:8082"

  - job_name: "redis"
    static_configs:
      - targets:
          - "if-performance-redis-exporter:9121"

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['if-performance-rabbitmq:15692']