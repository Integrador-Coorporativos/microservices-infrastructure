---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "academic-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "if-performance-academic-service:8085"

  - job_name: "import-and-report-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "if-performance-import-and-report-service:8082"

  - job_name: "redis"
    static_configs:
      - targets:
          - "if-performance-redis-exporter:9121"

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['if-performance-rabbitmq:15692']

  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['if-performance-minio:9000']

  - job_name: 'postgres_metrics'
    static_configs:
      - targets: ['postgres-exporter:9187']